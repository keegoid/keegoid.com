<head>
  <meta charset="UTF-8">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF9F5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16191D">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ if .Params.private }}<meta name="robots" content="noindex, nofollow, noarchive">{{ end }}

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ with .Params.background_image }}{{ . | absURL }}{{ else }}{{ .Site.Params.defaultImage | absURL }}{{ end }}">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ with .Params.background_image }}{{ . | absURL }}{{ else }}{{ .Site.Params.defaultImage | absURL }}{{ end }}">

  <!-- Fonts -->
  <link rel="preload" href="/fonts/Fraunces-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Newsreader-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Newsreader-Italic-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <!-- CSS Styles -->
  {{ $styleMain := resources.Get "css/style.css" }}
  {{ $styleSyntax := resources.Get "css/syntax.css" }}
  {{ $styles := slice $styleSyntax $styleMain | resources.Concat "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $styles.Permalink }}" integrity="{{ $styles.Data.Integrity }}">
  <link rel="icon" href="/images/brand/keegoid-mark.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="64x64" href="/images/brand/keegoid-mark-64.png">
  <link rel="apple-touch-icon" href="/images/brand/keegoid-mark-256.png">
</head>
